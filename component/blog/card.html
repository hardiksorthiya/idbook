<div class="post-card sorath-hover-view" data-cursor-text="View Blog">
    <div class="post-thumb">
        <img src="{{img}}" alt="{{title}}">
        <span class="category">{{category}}</span>
    </div>
    <div class="post-content">
        <ul class="post-meta">
            <li>{{date}}</li>
            <li>By <span>iDBook</span></li>
        </ul>
        <h5 class="title"><a href="{{href}}" class="stretched-link">{{title}}</a></h5>
        <p>{{text}}</p>
    </div>
</div>
