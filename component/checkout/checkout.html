<section class="cart-section">
    <div class="container container-2">
        <form class="checkout-grid" action="#">
            <div class="checkout-card">
                <h2>Delivery details</h2>
                <div class="checkout-fields">
                    <label>Full name<input type="text" name="name" placeholder="Your name" required></label>
                    <label>Email<input type="email" name="email" placeholder="you@email.com" required></label>
                    <label>Phone<input type="tel" name="phone" placeholder="Phone number" required></label>
                    <label>City<input type="text" name="city" placeholder="Surat" required></label>
                    <label class="wide">Address<textarea name="address" placeholder="House, street, area" required></textarea></label>
                </div>
            </div>
            <aside class="checkout-card checkout-summary">
                <h2>Your order</h2>
                <ul class="checkout-items">
                    <li>
                        <img src="assets/img/shop/shop-2.png" alt="">
                        <span><strong>Modern Caramel Fabric Sofa</strong><em>$157.00</em></span>
                    </li>
                    <li>
                        <img src="assets/img/shop/shop-1.png" alt="">
                        <span><strong>Luxury Skyline Sofa</strong><em>$157.00</em></span>
                    </li>
                </ul>
                <p class="cart-total"><span>Total</span><strong>$314.00</strong></p>
                <button class="tl-primary-btn" type="submit">Place order <span class="icon"><i class="fa-regular fa-arrow-right"></i></span></button>
                <p class="checkout-done" hidden>Your order is placed. We will contact you shortly.</p>
            </aside>
        </form>
    </div>
    <script>
        (function () {
            var form = document.querySelector(".checkout-grid");
            if (!form) return;
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                form.querySelector(".checkout-done").hidden = false;
            });
        })();
    </script>
</section>
