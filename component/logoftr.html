

<canvas id="dotCanvas"></canvas>
<style>
    .footer-section {
        padding-bottom: clamp(80px, calc(min(20vw, 30vh) + 16px), 436px);
    }
    .footer-text {
        width: 100%;
        max-width: 100%;
        height: clamp(64px, min(20vw, 30vh), 420px);
        left: 0;
        right: 0;
        bottom: 0;
        transform: none;
        z-index: 1;
        overflow: hidden;
    }
    #dotCanvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
    }
    @media (min-width: 993px) {
        .footer-wrap {
            padding: clamp(50px, 8vh, 90px) 0 clamp(30px, 5vh, 50px);
        }
        .footer-widget .social-list {
            margin-top: 40px;
        }
        .copyright-area {
            padding: 20px 0 8px;
        }
    }
</style>
<script>

const canvas = document.getElementById("dotCanvas");
const ctx = canvas.getContext("2d");

let width;
let height;

const mouse = {
    x: -1000,
    y: -1000,
    radius: 100
};

let particles = [];


// ======================================
// RESIZE
// ======================================

function resizeCanvas() {

    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = "100%";
    canvas.style.height = "100%";

    const rect = canvas.parentElement.getBoundingClientRect();
    width = Math.floor(rect.width);
    height = Math.floor(rect.height);
    if (!width || !height) return;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    mouse.radius = Math.max(36, Math.min(140, width * 0.08));

    createTextParticles();
}


// ======================================
// CREATE TEXT PARTICLES
// ======================================

function createTextParticles() {

    particles = [];

    // Invisible canvas for generating text
    const textCanvas = document.createElement("canvas");
    const textCtx = textCanvas.getContext("2d");

    textCanvas.width = width;
    textCanvas.height = height;

    /*
        Change this text
    */
    const text = "IDbook";

    /*
        Responsive font size
    */
    let fontSize = 100;
    textCtx.font = `900 ${fontSize}px "Orbitron", sans-serif`;
    let m = textCtx.measureText(text);
    const glyphH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    fontSize *= Math.min((width * 0.94) / m.width, (height * 0.94) / glyphH);
    textCtx.font = `900 ${fontSize}px "Orbitron", sans-serif`;
    m = textCtx.measureText(text);
    textCtx.textAlign = "center";
    textCtx.textBaseline = "alphabetic";

    /*
        Draw text
    */
    textCtx.fillStyle = "#000000";

    textCtx.fillText(
        text,
        width / 2,
        (height + m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2
    );

    /*
        Read pixels
    */
    const imageData = textCtx.getImageData(
        0,
        0,
        width,
        height
    );

    const data = imageData.data;

    /*
        Distance between dots.

        Smaller number = more dots
        Larger number = fewer dots
    */
    const gap = width < 480 ? 2 : width < 992 ? 3 : 4;


    for (let y = 0; y < height; y += gap) {

        for (let x = 0; x < width; x += gap) {

            const index = (y * width + x) * 4;

            const alpha = data[index + 3];

            if (alpha > 80) {

                particles.push({

                    // Original text position
                    baseX: x,
                    baseY: y,

                    // Current position
                    x: x,
                    y: y,

                    // Velocity
                    vx: 0,
                    vy: 0,

                    // Dot size
                    size: Math.random() * 0.8 + 0.7,

                    // Slight variation
                    alpha: Math.random() * 0.35 + 0.5
                });
            }
        }
    }
}


// ======================================
// MOUSE MOVE
// ======================================

canvas.addEventListener("mousemove", function(e) {

    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

});


// ======================================
// MOUSE LEAVE
// ======================================

canvas.addEventListener("mouseleave", function() {

    mouse.x = -1000;
    mouse.y = -1000;

});


// ======================================
// TOUCH SUPPORT
// ======================================

canvas.addEventListener("touchmove", function(e) {

    const touch = e.touches[0];

    const rect = canvas.getBoundingClientRect();
    mouse.x = touch.clientX - rect.left;
    mouse.y = touch.clientY - rect.top;

}, { passive: true });


canvas.addEventListener("touchend", function() {

    mouse.x = -1000;
    mouse.y = -1000;

});


// ======================================
// ANIMATION
// ======================================

function animate() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    particles.forEach(p => {

        // --------------------------------
        // Distance from mouse
        // --------------------------------

        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;

        const distance = Math.sqrt(
            dx * dx + dy * dy
        );


        // --------------------------------
        // Mouse repel
        // --------------------------------

        if (distance < mouse.radius) {

            const angle = Math.atan2(dy, dx);

            const force =
                (mouse.radius - distance)
                / mouse.radius;

            const push = force * 8;

            p.vx += Math.cos(angle) * push;
            p.vy += Math.sin(angle) * push;
        }


        // --------------------------------
        // Return to original position
        // --------------------------------

        const homeX = p.baseX - p.x;
        const homeY = p.baseY - p.y;

        p.vx += homeX * 0.025;
        p.vy += homeY * 0.025;


        // --------------------------------
        // Friction
        // --------------------------------

        p.vx *= 0.82;
        p.vy *= 0.82;


        // --------------------------------
        // Move
        // --------------------------------

        p.x += p.vx;
        p.y += p.vy;


        // --------------------------------
        // Draw dot
        // --------------------------------

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(190, 190, 190, ${p.alpha})`;

        ctx.fill();

    });


    requestAnimationFrame(animate);
}


// ======================================
// START
// ======================================

let resizeTimer;
function scheduleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 80);
}

window.addEventListener("resize", scheduleResize);

if (window.ResizeObserver) {
    new ResizeObserver(scheduleResize).observe(canvas.parentElement);
}

resizeCanvas();

if (document.fonts) {
    document.fonts.load('900 120px "Orbitron"').then(resizeCanvas);
}

animate();

</script>
