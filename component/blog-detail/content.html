<section class="blog-details pt-100 pb-100 overflow-hidden">
    <div class="container container-2">
        <div class="row gy-5 justify-content-center">
            <div class="col-lg-8 col-md-12">
                <div class="blog-details-wrap">
                    <div id="blog-article" data-include="component/blog-detail/posts/living.html"></div>
                    <script>
                        (function () {
                            var map = {
                                living: "component/blog-detail/posts/living.html",
                                kitchen: "component/blog-detail/posts/kitchen.html",
                                bedroom: "component/blog-detail/posts/bedroom.html",
                                bathroom: "component/blog-detail/posts/bathroom.html"
                            };
                            var names = {
                                living: "Living Room",
                                kitchen: "Kitchen",
                                bedroom: "Bedroom",
                                bathroom: "Bathroom"
                            };
                            var key = new URLSearchParams(location.search).get("post") || "living";
                            if (!map[key]) key = "living";
                            var el = document.getElementById("blog-article");
                            if (el) el.setAttribute("data-include", map[key]);
                            var crumb = document.querySelector(".page-header .inner-page");
                            if (crumb) crumb.textContent = names[key];
                        })();
                    </script>
                    <div class="form-wrap pt-70">
                        <div class="blog-contact-form">
                            <h2 class="title">Post Comment</h2>
                            <div class="request-form">
                                <form action="#" method="post" id="ajax_contact" class="form-horizontal">
                                    <div class="form-group row">
                                        <div class="col-md-4">
                                            <div class="form-item">
                                                <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Name*">
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-item">
                                                <input type="email" id="email" name="email" class="form-control" placeholder="Email*">
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-item">
                                                <input type="text" id="website" name="website" class="form-control" placeholder="Website*">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <div class="col-md-12">
                                            <div class="form-item message-item">
                                                <textarea id="message" name="message" cols="30" rows="8" class="form-control address" placeholder="Comment*"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="submit-btn">
                                        <button id="submit" class="tl-primary-btn" type="submit">Post Comment<span class="icon"><i class="fa-regular fa-arrow-right"></i></span></button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
